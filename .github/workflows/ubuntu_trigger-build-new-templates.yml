name: Ubuntu - Trigger Build New Templates

on:
  workflow_call:
    inputs:
      release_name:
        required: true
        type: string

      release_tag:
        required: true
        type: string

      hcl_filename:
        required: true
        type: string

      release_no:
        required: true
        type: string

      readme_file:
        required: true
        type: string

      gh_pr_labels:
        required: true
        type: string

    secrets:
      GH_TOKEN:
        required: true

jobs:
  Build-Packer-Template:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      PACKER_LOG: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main

      - name: Verify Packer version
        run: packer version

      - name: Initialize Packer template
        run: |
          packer init ${{ inputs.hcl_filename }}

      - name: Validate Packer template
        run: |
          packer validate ${{ inputs.hcl_filename }}

      - name: Build Ubuntu 26.04 template
        run: |
          packer build \
            -force \
            ${{ inputs.hcl_filename }}

      - name: Upload Packer manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packer-manifest
          path: |
            manifest.json
            *.log
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create build summary
        run: |
          {
            echo "# Ubuntu 26.04 Template Build"
            echo ""
            echo "- Release Name: ${{ inputs.release_name }}"
            echo "- Release Tag: ${{ inputs.release_tag }}"
            echo "- Packer Template: ${{ inputs.hcl_filename }}"
            echo "- Release Number: ${{ inputs.release_no }}"
          } >> $GITHUB_STEP_SUMMARY
